@if (showMaintenance()) {
  <app-maintenance-page />
} @else {
  @if (showSiteChrome()) {
    <app-site-header />
  }

  <!-- tabindex so "Saltar al contenido" can move the focus here. -->
  <main id="contenido" class="main" tabindex="-1">
    <router-outlet />
  </main>

  @if (showSiteChrome()) {
    <app-site-footer />
  }
}

<!-- The team, inside during maintenance: a reminder that the public is not. -->
@if (maintenance.bypass()) {
  <app-maintenance-badge />
}

<!-- «Web en desarrollo», on every page while Bipsy Business is being finished. -->
@if (!showMaintenance()) {
  <app-dev-notice [raised]="maintenance.bypass()" />
}

<!-- «Próximamente…» for the store badges and the social icons. -->
<app-coming-soon-toast />
