<section class="status" [class.status--standalone]="standalone">
  <div class="status__bg" aria-hidden="true">
    <div class="aura aura--mint status__a1"></div>
    <div class="aura aura--biz status__a2"></div>
  </div>

  @if (standalone) {
    <!-- Not a link on purpose: these pages are shown when there is nowhere to go. -->
    <div class="status__brand">
      <img class="theme-dark-only" src="assets_bipsy_business/Combination Marks/combinationmark_horizontal_dark_nobackground_trim.webp" alt="Bipsy Business" />
      <img class="theme-light-only" src="assets_bipsy_business/Combination Marks/combinationmark_horizontal_light_nobackground_trim.webp" alt="Bipsy Business" />
    </div>
  }

  <div class="status__inner">
    <div class="status__art" [class.status__art--rig]="rig">
      @if (rig; as name) {
        <app-bip-rig [rig]="name" [label]="'Mr. Bip ' + pose" />
      } @else {
        <app-bip-slot [code]="bip" [pose]="pose" ratio="3 / 5" />
      }
    </div>

    <div class="status__copy">
      <span class="eyebrow"><span class="material-symbols-rounded fill">{{ icon }}</span>{{ eyebrow }}</span>
      <h1 class="status__title">{{ heading }}</h1>
      <p class="lead">{{ lead }}</p>

      @if (message) {
        <p class="status__message">
          <span class="material-symbols-rounded" aria-hidden="true">campaign</span>
          <span>{{ message }}</span>
        </p>
      }

      <div class="status__actions btn-row">
        <ng-content select="[actions]" />
      </div>

      <ng-content />

      @if (note) {
        <p class="status__note">{{ note }}</p>
      }
    </div>
  </div>
</section>
